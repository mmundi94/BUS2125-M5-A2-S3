  :root {
    --ink: #161b2e;
    --ink-2: #414a63;
    --muted: #6b7390;
    --line: #e2e5ee;
    --paper: #ffffff;
    --blue: #0b5394;
    --blue-d: #083d6e;
    --blue-t: #e4eef8;
    --plum: #741b47;
    --plum-d: #561334;
    --plum-t: #f8e6ef;
    --tang: #d95a0b;
    --tang-d: #a8460a;
    --tang-t: #fdeadb;
    --jade: #0d8a66;
    --jade-d: #0a6b50;
    --jade-t: #dcf3ec;
    --slate: #4a5670;
    --slate-t: #eceef4;
    --good: #15803d;
    --good-t: #e1f5e7;
    --bad: #d42a3c;
    --bad-t: #fde6e9;
    --warn: #b86e00;
    --warn-c: #ffb020;
    --warn-t: #fff2d9;
    --font: "Lexend", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --shadow: 0 1px 2px rgba(20,25,50,.06), 0 12px 30px -16px rgba(20,30,70,.32);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font); font-size: 15.5px; line-height: 1.6; color: var(--ink);
    background-color: #f8f3ec;
    background-image:
      radial-gradient(38rem 26rem at -6% -6%, rgba(11,83,148,.26), transparent 62%),
      radial-gradient(36rem 26rem at 106% 2%, rgba(217,90,11,.24), transparent 60%),
      radial-gradient(40rem 28rem at 104% 98%, rgba(116,27,71,.22), transparent 62%),
      radial-gradient(40rem 28rem at -6% 102%, rgba(13,138,102,.24), transparent 60%);
    min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .34; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .15  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .wrap { position: relative; z-index: 1; max-width: 1160px; margin: 0 auto; padding: 22px 20px 32px; }
  h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.015em; font-weight: 600; }
  p { margin: 0; }
  .i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 3px solid var(--tang); outline-offset: 3px; border-radius: 8px; }
  [tabindex="-1"]:focus { outline: none; }
  .eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .13em; word-spacing: .15em; text-transform: uppercase; }

  /* Function palettes */
  .f-MK { --fc: var(--tang); --fx: var(--tang-d); --ft: var(--tang-t); }
  .f-OP { --fc: var(--blue); --fx: var(--blue); --ft: var(--blue-t); }
  .f-FI { --fc: var(--plum); --fx: var(--plum); --ft: var(--plum-t); }
  .f-CS { --fc: var(--jade); --fx: var(--jade-d); --ft: var(--jade-t); }
  .f-NA { --fc: var(--slate); --fx: var(--slate); --ft: var(--slate-t); }

  /* Header */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .uni b { display: block; font-size: 19px; font-weight: 600; color: var(--blue-d); }
  .uni span { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .chip-pa { display: inline-flex; align-items: center; gap: 8px; background: var(--plum); color: #fff; font-weight: 600; font-size: 13px; padding: 7px 14px 7px 10px; border-radius: 8px; }
  .chip-pa .i { width: 16px; height: 16px; }

  /* Track */
  .track { list-style: none; margin: 0 0 14px; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
  .track li { position: relative; background: rgba(255,255,255,.88); border-radius: 12px; padding: 9px 12px 12px; box-shadow: var(--shadow); font-size: 13px; font-weight: 500; color: var(--muted); overflow: hidden; }
  .track li::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--line); }
  .track li small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  .track li.cur { color: var(--ink); }
  .track li.cur::after { background: var(--blue); }
  .track li.done { color: var(--ink-2); }
  .track li.done::after { background: var(--jade); }
  .track .ts { display: none; }
  .track .mk { position: absolute; right: 8px; top: 8px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .track .mk .i { width: 11px; height: 11px; stroke-width: 3; }
  .track .mk.ok { background: var(--good); } .track .mk.no { background: var(--tang); }

  /* Function map */
  .fmap { background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px 16px; margin-bottom: 16px; }
  .fmap .mh { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .fmap .mh b { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--blue-d); }
  .fmap .mh span { font-size: 12px; color: var(--muted); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 5px; }
  .lrow { display: grid; grid-template-columns: minmax(0,1fr) 92px minmax(0,1fr) 92px minmax(0,1fr) 92px minmax(0,1fr); align-items: stretch; }
  .node { border-radius: 14px; background: var(--ft); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.04); transition: box-shadow .25s; }
  .node .nh { display: flex; align-items: center; gap: 8px; }
  .node .ni { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--fc); color: #fff; flex: none; }
  .node .ni .i { width: 17px; height: 17px; }
  .node .nh b { font-size: 14px; font-weight: 600; color: var(--fx); line-height: 1.2; }
  .node p { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; flex: 1; }
  .stt { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: #fff; }
  .stt::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .stt.ok { color: var(--good); } .stt.warn { color: var(--warn); } .stt.bad { color: var(--bad); } .stt.idle { color: var(--muted); }
  .node.hot { box-shadow: inset 0 0 0 2.5px var(--bad); }
  .inv { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; background: var(--fc); color: #fff; align-self: flex-start; }
  .link { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 4px; }
  .link .ln { width: 100%; height: 0; border-top: 3px dashed #c8cdd9; position: relative; }
  .link .ln::after { content: ""; position: absolute; right: -2px; top: -7.5px; border: 6px solid transparent; border-left: 8px solid #c8cdd9; }
  .link small { font-size: 10.5px; font-weight: 600; text-align: center; line-height: 1.25; color: var(--muted); }
  .link.ok .ln { border-top: 3px solid var(--good); } .link.ok .ln::after { border-left-color: var(--good); } .link.ok small { color: var(--good); }
  .link.broken .ln { border-top: 3px dashed var(--bad); } .link.broken .ln::after { display: none; } .link.broken small { color: var(--bad); }
  .link.broken .x { position: absolute; top: calc(50% - 22px); width: 20px; height: 20px; border-radius: 50%; background: var(--bad); color: #fff; display: grid; place-items: center; }
  .link.broken .x .i { width: 12px; height: 12px; stroke-width: 3; }
  .link.slow .ln { border-top: 3px solid var(--warn-c); } .link.slow .ln::after { border-left-color: var(--warn-c); } .link.slow small { color: var(--warn); }

  /* Stage card */
  .stage { background: var(--paper); border-radius: 20px; box-shadow: var(--shadow); padding: 22px; }
  .sh { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px; }
  .sh .num { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 19px; }
  .sh .eyebrow { color: var(--plum); }
  .sh h2 { font-size: clamp(20px, 2.4vw, 25px); margin-top: 2px; }
  .sh p { font-size: 14px; color: var(--ink-2); margin-top: 3px; }
  .q { font-size: 16.5px; font-weight: 600; margin-bottom: 3px; }
  .qsub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }

  /* Buttons */
  .btn { appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 10px; background: var(--blue); color: #fff; transition: background .12s; }
  .btn:hover:not(:disabled) { background: var(--blue-d); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.plum { background: var(--plum); } .btn.plum:hover:not(:disabled) { background: var(--plum-d); }
  .btn.line { background: #fff; color: var(--blue); box-shadow: inset 0 0 0 2px var(--blue); }
  .btn.line:hover:not(:disabled) { background: var(--blue-t); }
  .btn.soft { background: var(--blue-t); color: var(--blue-d); }
  .btn.soft:hover:not(:disabled) { background: #d3e3f4; }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
  .nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1.5px solid var(--line); flex-wrap: wrap; }
  .nav .mid { font-size: 13px; color: var(--muted); }
  .rowend { display: flex; justify-content: flex-end; margin-top: 12px; gap: 8px; flex-wrap: wrap; }

  /* Options */
  .opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
  .opt { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: start; padding: 13px 14px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 14.5px; line-height: 1.45; transition: border-color .15s, background .15s; }
  .opt:hover:not(:disabled) { border-color: #a9c1dc; }
  .opt .rd { width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 2px solid #b8c1d3; display: grid; place-items: center; }
  .opt[aria-checked="true"], .opt[aria-pressed="true"] { border-color: var(--blue); background: #f2f7fc; }
  .opt[aria-checked="true"] .rd { border-color: var(--blue); }
  .opt[aria-checked="true"] .rd::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); }
  .opt .bx { width: 20px; height: 20px; margin-top: 1px; border-radius: 6px; border: 2px solid #b8c1d3; display: grid; place-items: center; color: transparent; }
  .opt .bx .i { width: 13px; height: 13px; stroke-width: 3; }
  .opt[aria-pressed="true"] .bx { background: var(--blue); border-color: var(--blue); color: #fff; }

    var legend = LEVELS.map(function (l, j) {
      var m = ""; for (var k = 0; k < 3; k++) m += '<i class="' + (k <= j ? "on" : "") + '"></i>';
      return '<div class="lg ' + l.c + '"><b><span class="meter" aria-hidden="true">' + m + '</span>' + l.n + '</b><span>' + l.d + '</span></div>';
    }).join("");
    var sits = SITS.map(function (s, i) {
      var o = S.lv[i], key = "lv" + i, sel = o.revealed ? s.ok : o.sel;
      var seg = LEVELS.map(function (l, j) {
        var cls = l.c;
        if (o.locked) { if (o.revealed && j === s.ok) cls += " best"; else if (j === o.sel) cls += o.lastOk ? " right" : " wrong"; }
        var tab = (o.sel < 0 ? j === 0 : j === o.sel) ? 0 : -1;
        return '<button type="button" class="' + cls + '" role="radio" data-g="' + key + '" data-i="' + j + '" aria-checked="' + (!o.locked && j === sel) + '" tabindex="' + tab + '"' + (o.locked ? " disabled" : "") + '>' + l.n + '</button>';
      }).join("");
      var body = o.locked ? (o.lastOk || o.revealed ? s.fb[s.ok] : s.fb[o.sel]) : "";
      var stCls = o.locked ? (res(o) ? " ok" : " no") : "";
      return '<div class="sit f-' + s.f + stCls + '"><div class="st"><span class="si">' + ic(FN[s.f][1]) + '</span><p id="sq' + i + '"><small>' + FN[s.f][0] + '</small>' + s.t + '</p></div>' +
        '<div class="seg" role="radiogroup" aria-labelledby="sq' + i + '">' + seg + '</div>' + fbBlock(o, LEVELS[s.ok].n + " fits", body, body, body, key) + '</div>';
    }).join("");
    var all = S.lv.every(res);
    return '<section class="stage">' + stageHead(4, "Human or Technology?", "Choose the level of human involvement for each situation. Feedback appears as you choose.") +
      '<div class="legend3">' + legend + '</div><div class="sits">' + sits + '</div>' +
      (all ? '<div class="insight">' + ic("spark") + '<span>The level of human involvement depends on the nature and consequences of the work, not on how advanced the technology is.</span></div>' : "") +
      navHTML(4) + '</section>';
  }

  function vS5() {
    var o = S.two, picked = Object.keys(o.sel).filter(function (k) { return o.sel[k]; }).length;
    var flow = [
      ["MK", "Marketing", "Shares promotion plan", "Before launch"],
      ["OP", "Operations", "Updates demand forecast", "Technology forecasts, manager decides"],
      ["FI", "Finance", "Reviews inventory requirements", "Review time to watch"],
      ["NA", "Inventory", "Inventory is adjusted", "After finance review"],
      ["NA", "Launch", "Promotion launches", "On schedule"],
      ["CS", "Customer Service", "Sees current availability", "Answers with current data"]
    ].map(function (x) { return '<div class="fl f-' + x[0] + '"><small>' + x[1] + '</small><b>' + x[2] + '</b><span class="rb">' + x[3] + '</span></div>'; }).join("");
    var opts = STMT.map(function (s, j) {
      var on = !!o.sel[j], cls = "opt";
      if (o.locked) {
        if (o.revealed) cls += s.ok ? " best" : (on ? " wrong" : " dim");
        else if (on) cls += s.ok ? " right" : " wrong"; else cls += " dim";
      }
      return '<button type="button" class="' + cls + '" data-two="' + j + '" aria-pressed="' + on + '"' + (o.locked ? " disabled" : "") + '><span class="bx">' + ic("check") + '</span><span>' + s.t + '</span></button>';
    }).join("");
    var after = "";
    if (o.locked) {
      var wrongs = STMT.filter(function (s, j) { return o.sel[j] && !s.ok; }).map(function (s) { return s.fb; });
      var okBody = "The redesigned workflow is stronger because information reaches connected functions early enough for them to act, and the workflow is clearer about what technology does and where people remain involved.";
      after = fbBlock(o, "Both reasons identified", okBody, wrongs.join(" ") || "Choose the two statements that explain why the redesign works.", okBody, "two");
      if (res(o)) {
        after += '<div class="sumgrid">' +
          '<div class="sm" style="--sc:var(--tang-d)"><small>Digital change</small><p>Promotion information becomes available earlier.</p></div>' +
          '<div class="sm" style="--sc:var(--blue);animation-delay:.08s"><small>Functional effect</small><p>Marketing, operations, finance, and customer service coordinate their work.</p></div>' +
          '<div class="sm" style="--sc:var(--plum);animation-delay:.16s"><small>Workflow effect</small><p>The original information delay is reduced, while new bottlenecks can be identified.</p></div>' +
          '<div class="sm" style="--sc:var(--jade-d);animation-delay:.24s"><small>Human + technology</small><p>Technology supports processing, monitoring, forecasting, and initial outputs while people remain involved where verification, judgment, or accountability is needed.</p></div></div>' +
          '<div class="finalmsg">' + ic("network") + '<span>Digital change is effective when technology, people, and connected business functions work as part of the same process.</span></div>';
      }
    }
    return '<section class="stage">' + stageHead(5, "Functional Change Review", "Here is the completed promotion workflow.") +
      '<div class="flowline">' + flow + '</div>' +
      '<p class="q" id="q-two">Which TWO statements best explain why the redesigned workflow is stronger?</p><p class="qsub">Select two, then submit.</p>' +
      '<div class="opts" role="group" aria-labelledby="q-two">' + opts + '</div>' + after +
      (o.locked ? "" : '<div class="rowend"><button class="btn" type="button" data-act="twosubmit"' + (picked === 2 ? "" : " disabled") + '>' + ic("check") + 'Submit two statements</button></div>') +
      navHTML(5) + '</section>';
  }

  var VIEWS = [vIntro, vS1, vS2, vS3, vS4, vS5];

  function render(focusSel, scroll) {
    renderTrack(); renderMap();
    app.innerHTML = '<main>' + VIEWS[S.view]() + '</main>';
    if (focusSel) {
      var el = app.querySelector(focusSel);
      if (el) { el.focus({ preventScroll: true }); if (scroll) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" }); }
    }
  }
  function revealStage(k) {
    if (k === 1 && !res(S.m1)) { S.m1.revealed = true; S.m1.locked = true; }
    if (k === 2 && !res(S.wf)) { S.wf.revealed = true; S.wf.locked = true; S.wf.pos = ORDER.slice(); S.wf.slotOk = ORDER.map(function () { return true; }); }
    if (k === 3 && !res(S.m3)) { S.m3.revealed = true; S.m3.locked = true; }
    if (k === 4) S.lv.forEach(function (o) { if (!res(o)) { o.revealed = true; o.locked = true; } });
  }
  function go(v) {
    if (S.view >= 1 && S.view <= 4 && v > S.view && attempted(S.view)) revealStage(S.view);
    S.view = v; S.wf.sel = null;
    render("#vh"); window.scrollTo(0, 0);
    say(v === 0 ? "Introduction" : "Stage " + v + " of 5: " + STAGES[v - 1]);
  }

  /* ---------- Single choice ---------- */
  function stateOf(key) { if (key === "m1") return S.m1; if (key === "m3") return S.m3; if (key.indexOf("lv") === 0) return S.lv[+key.slice(2)]; return null; }
  function okOf(key) { if (key === "m1") return M1.ok; if (key === "m3") return M3.ok; return SITS[+key.slice(2)].ok; }
  function sizeOf(key) { if (key === "m1") return M1.opts.length; if (key === "m3") return PIPE.length; return 3; }
  function lockChoice(key) {
    var o = stateOf(key); if (!o || o.sel < 0 || o.locked) return;
    var ok = o.sel === okOf(key);
    if (o.first === null) o.first = ok;
    o.lastOk = ok; o.locked = true;
    render("#fbt-" + key, true);
    say(ok ? (o.first ? "Correct." : "Correct on this try.") : "Recorded as incorrect. You can try again, show the best choice, or move on.");
  }
  function choose(key, i) {
    var o = stateOf(key); if (!o || o.locked) return;
    o.sel = i;
    if (key.indexOf("lv") === 0) { lockChoice(key); return; }
    render('[data-g="' + key + '"][data-i="' + i + '"]');
  }

  /* ---------- Workflow builder ---------- */
  function slotOf(id) { return S.wf.pos.indexOf(id); }
  function place(id, slot) { var wf = S.wf, from = slotOf(id), occ = wf.pos[slot]; if (from === slot) return; wf.pos[slot] = id; if (from > -1) wf.pos[from] = occ || null; }
  function toTray(id) { var f = slotOf(id); if (f > -1) S.wf.pos[f] = null; }
  function cardClick(id) {
    var wf = S.wf; if (wf.locked) return;
    if (wf.sel === id) { wf.sel = null; render('[data-card="' + id + '"]'); say("Card released."); return; }
    if (wf.sel && slotOf(id) > -1) { var t = slotOf(id), m = wf.sel; place(m, t); wf.sel = null; render('[data-card="' + m + '"]'); say(CARDS[m].t + " placed in step " + (t + 1) + "."); return; }
    wf.sel = id; render('[data-card="' + id + '"]'); say(CARDS[id].t + " selected. Choose a step.");
  }
  function slotClick(i) { var wf = S.wf; if (!wf.sel || wf.locked) return; var id = wf.sel; place(id, i); wf.sel = null; render('[data-card="' + id + '"]'); say(CARDS[id].t + " placed in step " + (i + 1) + "."); }
  function wfSubmit() {
    var wf = S.wf; if (wf.pos.filter(Boolean).length < 6 || wf.locked) return;
    wf.slotOk = wf.pos.map(function (id, i) { return id === ORDER[i]; });
    var ok = wf.slotOk.every(Boolean);
    if (wf.first === null) wf.first = ok;
    wf.lastOk = ok; wf.locked = true; wf.sel = null;
    render("#fbt-wf", true);
    say(ok ? "Workflow repaired." : "Recorded as incorrect. You can rearrange, show the repaired workflow, or move on.");
  }

  var drag = null, suppress = false;
  app.addEventListener("pointerdown", function (e) {
    var c = e.target.closest(".wcard");
    if (!c || c.disabled || S.view !== 2 || S.wf.locked) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    drag = { id: c.getAttribute("data-card"), el: c, x: e.clientX, y: e.clientY, on: false, pid: e.pointerId, vy: 0, raf: 0 };
  });
  function autoScroll() { if (!drag || !drag.on || !drag.vy) { if (drag) drag.raf = 0; return; } window.scrollBy(0, drag.vy); drag.raf = requestAnimationFrame(autoScroll); }
  window.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.pid) return;
    if (!drag.on) {
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 8) return;
      drag.on = true;
      var g = drag.el.cloneNode(true); g.classList.add("ghost"); g.removeAttribute("data-card"); g.setAttribute("aria-hidden", "true");
      document.body.appendChild(g); drag.ghost = g; drag.el.classList.add("lifted");
    }
    e.preventDefault();
    drag.ghost.style.left = (e.clientX - 100) + "px"; drag.ghost.style.top = (e.clientY - 26) + "px";
    var edge = 70, vy = 0;
    if (e.clientY < edge) vy = -Math.ceil((edge - e.clientY) / 5); else if (e.clientY > window.innerHeight - edge) vy = Math.ceil((e.clientY - (window.innerHeight - edge)) / 5);
    drag.vy = vy; if (vy && !drag.raf) drag.raf = requestAnimationFrame(autoScroll);
    var over = document.elementFromPoint(e.clientX, e.clientY);
    app.querySelectorAll(".slot.hot, .tray.hot").forEach(function (n) { n.classList.remove("hot"); });
    var sl = over && over.closest("[data-slot]"), tr = over && over.closest("[data-tray]");
    if (sl) sl.classList.add("hot"); else if (tr) tr.classList.add("hot");
  }, { passive: false });
  function endDrag(e, cancel) {
    if (!drag || e.pointerId !== drag.pid) return;
    var d = drag; drag = null;
    if (d.raf) cancelAnimationFrame(d.raf);
    if (!d.on) return;
    suppress = true; setTimeout(function () { suppress = false; }, 60);
    if (d.ghost) d.ghost.remove();
    if (cancel) { render(); return; }
    var over = document.elementFromPoint(e.clientX, e.clientY), sl = over && over.closest("[data-slot]"), tr = over && over.closest("[data-tray]");
    S.wf.sel = null;
    if (sl) { var i = +sl.getAttribute("data-slot"); place(d.id, i); say(CARDS[d.id].t + " placed in step " + (i + 1) + "."); }
    else if (tr || !over || !over.closest(".lane")) toTray(d.id);
    render('[data-card="' + d.id + '"]');
  }
  window.addEventListener("pointerup", function (e) { endDrag(e, false); });
  window.addEventListener("pointercancel", function (e) { endDrag(e, true); });

  /* ---------- Events ---------- */
  var ACT = {
    start: function () { go(1); },
    next: function () { if (S.view < 5 && attempted(S.view)) go(S.view + 1); },
    back: function () { if (S.view > 0) go(S.view - 1); },
    submit: function (t) { lockChoice(t.getAttribute("data-k")); },
    retry: function (t) {
      var k = t.getAttribute("data-k");
      if (k === "wf") { S.wf.locked = false; S.wf.lastOk = false; S.wf.slotOk = null; render(".wcard"); }
      else if (k === "two") { S.two.locked = false; S.two.lastOk = false; S.two.sel = {}; render('[data-two="0"]'); }
      else { var o = stateOf(k); o.locked = false; o.lastOk = false; o.sel = -1; render('[data-g="' + k + '"][data-i="0"]'); }
      say("Try again. Your first attempt stays recorded.");
    },
    reveal: function (t) {
      var k = t.getAttribute("data-k");
      if (k === "wf") { revealStage(2); }
      else if (k === "two") { S.two.revealed = true; S.two.locked = true; S.two.sel = { 1: true, 3: true }; }
      else { var o = stateOf(k); o.revealed = true; o.locked = true; }
      render("#fbt-" + k, true); say("Best choice shown.");
    },
    wfsubmit: wfSubmit,
    clear: function () { S.wf.pos = [null, null, null, null, null, null]; S.wf.sel = null; render("[data-card]"); say("Workflow cleared."); },
    totray: function () { var id = S.wf.sel; if (!id) return; toTray(id); S.wf.sel = null; render('[data-card="' + id + '"]'); say(CARDS[id].t + " returned to the tray."); },
    twosubmit: function () {
      var o = S.two, picks = Object.keys(o.sel).filter(function (k) { return o.sel[k]; });
      if (picks.length !== 2 || o.locked) return;
      var ok = picks.every(function (k) { return STMT[+k].ok; });
      if (o.first === null) o.first = ok;
      o.lastOk = ok; o.locked = true;
      render("#fbt-two", true);
      say(ok ? "Both reasons identified. Summary shown." : "Recorded as incorrect. You can try again or show the best choice.");
    },
    restart: function () { reset(); go(0); }
  };

  app.addEventListener("click", function (e) {
    if (suppress) { e.preventDefault(); return; }
    var t = e.target.closest("[data-act],[data-g],[data-card],[data-slot-btn],[data-two]");
    if (!t || t.disabled) return;
    if (t.hasAttribute("data-act")) { var f = ACT[t.getAttribute("data-act")]; if (f) f(t); return; }
    if (t.hasAttribute("data-card")) { cardClick(t.getAttribute("data-card")); return; }
    if (t.hasAttribute("data-slot-btn")) { slotClick(+t.getAttribute("data-slot-btn")); return; }
    if (t.hasAttribute("data-two")) {
      var j = +t.getAttribute("data-two"), o = S.two; if (o.locked) return;
      var n = Object.keys(o.sel).filter(function (k) { return o.sel[k]; }).length;
      if (!o.sel[j] && n >= 2) { say("You can select two statements. Clear one first."); return; }
      o.sel[j] = !o.sel[j]; render('[data-two="' + j + '"]'); return;
    }
    if (t.hasAttribute("data-g")) choose(t.getAttribute("data-g"), +t.getAttribute("data-i"));
  });
  app.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.wf.sel) { var id = S.wf.sel; S.wf.sel = null; render('[data-card="' + id + '"]'); say("Selection cancelled."); return; }
    var t = e.target.closest("[data-g]");
    if (!t || t.disabled) return;
    var key = t.getAttribute("data-g"), i = +t.getAttribute("data-i"), n = sizeOf(key), to = -1;
    if (e.key === "ArrowDown" || e.key === "ArrowRight") to = (i + 1) % n;
    else if (e.key === "ArrowUp" || e.key === "ArrowLeft") to = (i - 1 + n) % n;
    else if (e.key === "Home") to = 0; else if (e.key === "End") to = n - 1;
    if (to < 0) return;
    e.preventDefault();
    if (key.indexOf("lv") === 0) {
      var bs = app.querySelectorAll('[data-g="' + key + '"]');
      bs.forEach(function (b, k) { b.tabIndex = k === to ? 0 : -1; });
      bs[to].focus();
      return;
    }
    choose(key, to);
  });

  reset();
  go(0);
})();
</script>
</body>
</html>
